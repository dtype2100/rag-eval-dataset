name: Dataset contract tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: node site/tests/evidence.test.mjs
      - run: python skills/rag-dataset-builder/scripts/dataset.py validate examples/toy/dataset.json
      - run: python skills/rag-dataset-builder/scripts/dataset.py freeze examples/toy/dataset.json --out "$RUNNER_TEMP/toy-dataset.v1.json"
      - run: python skills/rag-dataset-builder/scripts/dataset.py validate "$RUNNER_TEMP/toy-dataset.v1.json"
      - name: Reproduce public-source cases and deliberate corruption checks
        run: |
          for topic in policy pricing support; do
            python scripts/verify_public_cases.py "examples/public-cases/$topic/dataset.json" --fetch --exercise
            python skills/rag-dataset-builder/scripts/dataset.py freeze "examples/public-cases/$topic/dataset.json" --out "$RUNNER_TEMP/$topic.v1.json"
            python scripts/verify_public_cases.py "$RUNNER_TEMP/$topic.v1.json"
          done
